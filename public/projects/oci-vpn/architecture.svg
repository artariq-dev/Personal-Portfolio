<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Courier New', Courier, monospace">
  <!-- Background -->
  <rect width="900" height="520" fill="#f9fafb" rx="8"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">OCI VPN — OpenVPN on Oracle Cloud Free Tier</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="#6b7280">One terraform apply · Zero manual steps · $0/month</text>

  <!-- ═══ INTERNET ═══ -->
  <rect x="360" y="72" width="180" height="46" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="450" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Internet</text>
  <text x="450" y="110" text-anchor="middle" font-size="9" fill="#64748b">Client devices / admin browser</text>

  <!-- Arrow down -->
  <line x1="450" y1="118" x2="450" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#sarr)"/>

  <!-- ═══ OCI VCN OUTER BOX ═══ -->
  <rect x="60" y="148" width="780" height="300" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="450" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2410c">Oracle Cloud Infrastructure — VCN (10.0.0.0/16)</text>

  <!-- Internet Gateway -->
  <rect x="330" y="178" width="240" height="44" rx="4" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text x="450" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">Internet Gateway</text>
  <text x="450" y="211" text-anchor="middle" font-size="9" fill="#9a3412">Public internet access · Default route 0.0.0.0/0</text>

  <!-- Arrow down -->
  <line x1="450" y1="222" x2="450" y2="252" stroke="#fb923c" stroke-width="1.5" marker-end="url(#oarr)"/>

  <!-- Route Table -->
  <rect x="330" y="252" width="240" height="36" rx="4" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text x="450" y="268" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2410c">Route Table</text>
  <text x="450" y="282" text-anchor="middle" font-size="9" fill="#9a3412">0.0.0.0/0 → Internet Gateway</text>

  <!-- Arrow down -->
  <line x1="450" y1="288" x2="450" y2="308" stroke="#fb923c" stroke-width="1.5" marker-end="url(#oarr)"/>

  <!-- Subnet box -->
  <rect x="120" y="308" width="660" height="120" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="326" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Subnet — 10.0.1.0/24</text>

  <!-- Security List -->
  <rect x="140" y="336" width="220" height="82" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="250" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Security List</text>
  <text x="154" y="368" font-size="8.5" fill="#78350f">22/tcp   — SSH (management)</text>
  <text x="154" y="382" font-size="8.5" fill="#78350f">443/tcp  — HTTPS (web UI)</text>
  <text x="154" y="396" font-size="8.5" fill="#78350f">943/tcp  — OpenVPN admin</text>
  <text x="154" y="410" font-size="8.5" fill="#78350f">1194/udp — OpenVPN tunnel</text>

  <!-- Compute Instance -->
  <rect x="390" y="336" width="370" height="82" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="575" y="354" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Compute Instance</text>
  <text x="575" y="368" text-anchor="middle" font-size="9" fill="#78350f">VM.Standard.E2.1.Micro · Free Tier Eligible</text>

  <!-- OpenVPN sub-box -->
  <rect x="406" y="376" width="338" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="575" y="390" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">OpenVPN Access Server</text>
  <text x="575" y="403" text-anchor="middle" font-size="8" fill="#166534">Auto-installed via cloud-init user_data on first boot · No SSH required</text>

  <!-- ═══ TERRAFORM PANEL ═══ -->
  <rect x="60" y="460" width="380" height="46" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="477" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">Terraform Provisions Everything</text>
  <text x="250" y="493" text-anchor="middle" font-size="9" fill="#1e40af">main.tf · network.tf · compute.tf · security.tf · data.tf · variables.tf · outputs.tf</text>

  <!-- Outputs panel -->
  <rect x="460" y="460" width="380" height="46" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="477" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">Outputs After Apply</text>
  <text x="650" y="493" text-anchor="middle" font-size="9" fill="#166534">openvpn_public_ip · openvpn_admin_url (https://&lt;ip&gt;:943/admin) · openvpn_client_url</text>

  <!-- Teardown note -->
  <text x="450" y="516" text-anchor="middle" font-size="9" fill="#9ca3af">terraform destroy — entire environment removed in seconds · No orphaned resources</text>

  <defs>
    <marker id="sarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="oarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fb923c"/>
    </marker>
  </defs>
</svg>
