<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="400" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#f1f5f9">OCI VPN — Self-Hosted OpenVPN</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#94a3b8">Terraform · Oracle Cloud · cloud-init · Free Tier · $0/month</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
    </marker>
  </defs>

  <!-- ── Terraform (left) ── -->
  <rect x="30" y="150" width="80" height="80" rx="8" fill="#1e293b" stroke="#5C4EE5" stroke-width="1.5"/>
  <image href="/icons/terraform.svg" x="56" y="162" width="28" height="28"/>
  <text x="70" y="215" text-anchor="middle" font-size="9" fill="#94a3b8">Terraform</text>
  <text x="70" y="226" text-anchor="middle" font-size="8" fill="#64748b">provisions</text>

  <!-- Terraform → OCI arrow (top, spanning) -->
  <line x1="110" y1="190" x2="175" y2="190" stroke="#5C4EE5" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,3"/>

  <!-- ── VPN Client (far left top) ── -->
  <rect x="30" y="60" width="80" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="70" y="85" text-anchor="middle" font-size="10" font-weight="bold" fill="#f1f5f9">VPN</text>
  <text x="70" y="99" text-anchor="middle" font-size="10" font-weight="bold" fill="#f1f5f9">Client</text>
  <text x="70" y="113" text-anchor="middle" font-size="8" fill="#64748b">any device</text>

  <!-- Client → IGW -->
  <line x1="110" y1="90" x2="210" y2="130" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── OCI VCN Group ── -->
  <rect x="170" y="75" width="700" height="295" rx="10" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="185" y="95" font-size="10" font-weight="bold" fill="#f97316">Oracle Cloud — VCN 10.0.0.0/16</text>

  <!-- Internet Gateway node -->
  <rect x="200" y="108" width="80" height="80" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <image href="/icons/ocigateway.svg" x="226" y="120" width="28" height="28"/>
  <text x="240" y="167" text-anchor="middle" font-size="9" fill="#94a3b8">Internet</text>
  <text x="240" y="178" text-anchor="middle" font-size="9" fill="#94a3b8">Gateway</text>

  <!-- IGW → Route Table -->
  <line x1="280" y1="148" x2="340" y2="148" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <!-- Route Table (no icon) -->
  <rect x="340" y="118" width="110" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="395" y="143" text-anchor="middle" font-size="9" font-weight="bold" fill="#f1f5f9">Route Table</text>
  <text x="395" y="157" text-anchor="middle" font-size="8" fill="#64748b">0.0.0.0/0 → IGW</text>
  <text x="395" y="169" text-anchor="middle" font-size="8" fill="#64748b">10.0.1.0/24</text>

  <!-- Route Table → Subnet -->
  <line x1="450" y1="148" x2="510" y2="148" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <!-- ── Subnet group ── -->
  <rect x="505" y="100" width="345" height="250" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="520" y="118" font-size="9" font-weight="bold" fill="#f59e0b">Subnet 10.0.1.0/24</text>

  <!-- Security List node -->
  <rect x="522" y="128" width="80" height="80" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <image href="/icons/bastion.svg" x="548" y="140" width="28" height="28"/>
  <text x="562" y="187" text-anchor="middle" font-size="9" fill="#94a3b8">Security</text>
  <text x="562" y="198" text-anchor="middle" font-size="9" fill="#94a3b8">List</text>
  <!-- Port labels -->
  <text x="562" y="222" text-anchor="middle" font-size="7.5" fill="#64748b">22 · 443 · 943 · 1194</text>

  <!-- Security List → Compute -->
  <line x1="602" y1="168" x2="650" y2="168" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Compute VM node -->
  <rect x="650" y="128" width="80" height="80" rx="8" fill="#1e293b" stroke="#C74634" stroke-width="1.5"/>
  <image href="/icons/ocicompute.svg" x="676" y="140" width="28" height="28"/>
  <text x="690" y="187" text-anchor="middle" font-size="9" fill="#94a3b8">Compute</text>
  <text x="690" y="198" text-anchor="middle" font-size="9" fill="#94a3b8">VM · Free Tier</text>

  <!-- Compute → OpenVPN (below) -->
  <line x1="690" y1="208" x2="690" y2="248" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- OpenVPN node -->
  <rect x="650" y="248" width="80" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <image href="/icons/openvpn.svg" x="676" y="260" width="28" height="28"/>
  <text x="690" y="307" text-anchor="middle" font-size="9" fill="#94a3b8">OpenVPN</text>
  <text x="690" y="318" text-anchor="middle" font-size="9" fill="#64748b">cloud-init</text>

  <!-- cloud-init label -->
  <text x="690" y="340" text-anchor="middle" font-size="8" fill="#22c55e">auto-install on boot</text>

  <!-- Badge bottom -->
  <rect x="530" y="300" width="95" height="38" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="577" y="315" text-anchor="middle" font-size="8" font-weight="bold" fill="#22c55e">$0 / month</text>
  <text x="577" y="328" text-anchor="middle" font-size="8" fill="#64748b">1 command deploy</text>

</svg>
