<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="460" fill="#0f172a"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#10b981"/></marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f97316"/></marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6"/></marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#f1f5f9">Multi-Environment GitOps with Sealed Secrets</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#94a3b8">K3s · ArgoCD · Helm · Kustomize · Sealed Secrets · Azure</text>

  <!-- ══ ROW 1: Dev → GitHub Actions ══ -->
  <!-- Developer -->
  <rect x="20" y="70" width="72" height="72" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="56" y="106" text-anchor="middle" font-size="22" fill="#f1f5f9">👤</text>
  <text x="56" y="128" text-anchor="middle" font-size="9" fill="#94a3b8">Developer</text>
  <text x="56" y="140" text-anchor="middle" font-size="8" fill="#64748b">git push</text>

  <line x1="92" y1="106" x2="128" y2="106" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CI group -->
  <rect x="125" y="58" width="390" height="96" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="140" y="74" font-size="9" font-weight="bold" fill="#3b82f6">CI Pipeline</text>

  <!-- GitHub Actions -->
  <rect x="135" y="78" width="72" height="72" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <image href="/icons/githubactions.svg" x="161" y="90" width="28" height="28"/>
  <text x="171" y="133" text-anchor="middle" font-size="9" fill="#94a3b8">GitHub</text>
  <text x="171" y="144" text-anchor="middle" font-size="9" fill="#94a3b8">Actions</text>

  <line x1="207" y1="114" x2="233" y2="114" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Docker Build -->
  <rect x="233" y="78" width="72" height="72" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <image href="/icons/docker.svg" x="259" y="90" width="28" height="28"/>
  <text x="269" y="133" text-anchor="middle" font-size="9" fill="#94a3b8">Docker</text>
  <text x="269" y="144" text-anchor="middle" font-size="9" fill="#94a3b8">Build</text>

  <line x1="305" y1="114" x2="331" y2="114" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Trivy -->
  <rect x="331" y="78" width="72" height="72" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <image href="/icons/trivy.svg" x="357" y="90" width="28" height="28"/>
  <text x="367" y="133" text-anchor="middle" font-size="9" fill="#94a3b8">Trivy</text>
  <text x="367" y="144" text-anchor="middle" font-size="9" fill="#94a3b8">Scan</text>

  <line x1="403" y1="114" x2="429" y2="114" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Docker Hub push -->
  <rect x="429" y="78" width="80" height="72" rx="8" fill="#1e293b" stroke="#2496ED" stroke-width="1.5"/>
  <text x="469" y="106" text-anchor="middle" font-size="22">🐳</text>
  <text x="469" y="128" text-anchor="middle" font-size="9" fill="#94a3b8">Docker Hub</text>
  <text x="469" y="140" text-anchor="middle" font-size="8" fill="#64748b">image push</text>

  <!-- ══ ROW 2: Azure Infra + K3s Cluster ══ -->

  <!-- Azure Infra group -->
  <rect x="20" y="185" width="250" height="110" rx="8" fill="none" stroke="#f97316" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="35" y="200" font-size="9" font-weight="bold" fill="#f97316">Azure Infrastructure</text>

  <rect x="30" y="208" width="72" height="72" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <image href="/icons/terraform.svg" x="56" y="220" width="28" height="28"/>
  <text x="66" y="263" text-anchor="middle" font-size="9" fill="#94a3b8">Terraform</text>

  <line x1="102" y1="244" x2="128" y2="244" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <rect x="128" y="208" width="72" height="72" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <image href="/icons/azurevm.svg" x="154" y="220" width="28" height="28"/>
  <text x="164" y="263" text-anchor="middle" font-size="9" fill="#94a3b8">K3s VM</text>
  <text x="164" y="274" text-anchor="middle" font-size="8" fill="#64748b">Azure</text>

  <!-- Terraform also provisions VNet label -->
  <rect x="30" y="286" width="170" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="115" y="300" text-anchor="middle" font-size="8" fill="#64748b">[azurevnet] VNet + NSG</text>

  <!-- K3s Cluster group -->
  <rect x="285" y="185" width="595" height="180" rx="8" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="300" y="200" font-size="9" font-weight="bold" fill="#10b981">K3s Cluster</text>

  <!-- ArgoCD -->
  <rect x="295" y="208" width="72" height="72" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <image href="/icons/argo.svg" x="321" y="220" width="28" height="28"/>
  <text x="331" y="263" text-anchor="middle" font-size="9" fill="#94a3b8">ArgoCD</text>
  <text x="331" y="274" text-anchor="middle" font-size="8" fill="#64748b">auto-sync</text>

  <line x1="367" y1="244" x2="393" y2="244" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Helm -->
  <rect x="393" y="208" width="72" height="72" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <image href="/icons/helm.svg" x="419" y="220" width="28" height="28"/>
  <text x="429" y="263" text-anchor="middle" font-size="9" fill="#94a3b8">Helm</text>
  <text x="429" y="274" text-anchor="middle" font-size="8" fill="#64748b">chart</text>

  <line x1="465" y1="244" x2="491" y2="244" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Kustomize -->
  <rect x="491" y="208" width="72" height="72" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <image href="/icons/kustomize.svg" x="517" y="220" width="28" height="28"/>
  <text x="527" y="263" text-anchor="middle" font-size="9" fill="#94a3b8">Kustomize</text>
  <text x="527" y="274" text-anchor="middle" font-size="8" fill="#64748b">overlays</text>

  <line x1="563" y1="244" x2="589" y2="224" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="563" y1="244" x2="589" y2="244" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="563" y1="244" x2="589" y2="264" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- 3 Env boxes -->
  <rect x="589" y="202" width="60" height="30" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="619" y="213" text-anchor="middle" font-size="8" font-weight="bold" fill="#3b82f6">dev</text>
  <text x="619" y="225" text-anchor="middle" font-size="7" fill="#64748b">1 replica</text>

  <rect x="589" y="237" width="60" height="30" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="619" y="248" text-anchor="middle" font-size="8" font-weight="bold" fill="#10b981">staging</text>
  <text x="619" y="260" text-anchor="middle" font-size="7" fill="#64748b">2 replicas</text>

  <rect x="589" y="272" width="60" height="30" rx="5" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
  <text x="619" y="283" text-anchor="middle" font-size="8" font-weight="bold" fill="#f97316">prod</text>
  <text x="619" y="295" text-anchor="middle" font-size="7" fill="#64748b">3 replicas</text>

  <!-- ══ Sealed Secrets row ══ -->
  <rect x="285" y="375" width="595" height="60" rx="8" fill="#1e2040" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="300" y="392" font-size="9" font-weight="bold" fill="#8b5cf6">Sealed Secrets — 0 plaintext credentials in Git</text>

  <text x="310" y="415" font-size="9" fill="#94a3b8">kubeseal encrypt</text>
  <line x1="400" y1="411" x2="430" y2="411" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <text x="440" y="415" font-size="9" fill="#94a3b8">SealedSecret → Git</text>
  <line x1="540" y1="411" x2="570" y2="411" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <text x="580" y="415" font-size="9" fill="#94a3b8">controller decrypts → K8s Secret</text>

  <!-- Connect arrows across rows -->
  <!-- GitHub Actions → ArgoCD trigger -->
  <line x1="171" y1="150" x2="171" y2="175" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="171" y1="175" x2="331" y2="200" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Terraform → K3s VM connects left to right -->
  <line x1="200" y1="244" x2="295" y2="244" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <!-- Docker Hub → ArgoCD -->
  <line x1="469" y1="150" x2="469" y2="175" stroke="#2496ED" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="469" y1="175" x2="331" y2="200" stroke="#2496ED" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr)"/>

</svg>
