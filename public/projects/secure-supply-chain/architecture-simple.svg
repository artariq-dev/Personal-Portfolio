<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="480" fill="#0f172a"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#10b981"/></marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/></marker>
    <marker id="arr-y" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#eab308"/></marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6"/></marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#f1f5f9">End-to-End Secure Software Supply Chain</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#94a3b8">Cosign Keyless · SLSA L2 · Kyverno · Falco · GHCR · Distroless</text>

  <!-- ══ ROW 1: CI Pipeline ══ -->
  <rect x="15" y="62" width="870" height="110" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="30" y="78" font-size="9" font-weight="bold" fill="#3b82f6">CI Pipeline — GitHub Actions (main branch only)</text>

  <!-- Dev -->
  <rect x="25" y="84" width="72" height="72" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="61" y="120" text-anchor="middle" font-size="22" fill="#f1f5f9">👤</text>
  <text x="61" y="143" text-anchor="middle" font-size="9" fill="#94a3b8">git push</text>

  <line x1="97" y1="120" x2="117" y2="120" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Build -->
  <rect x="117" y="84" width="72" height="72" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <image href="/icons/go.svg" x="143" y="96" width="28" height="28"/>
  <text x="153" y="139" text-anchor="middle" font-size="9" fill="#94a3b8">Build</text>
  <text x="153" y="150" text-anchor="middle" font-size="8" fill="#64748b">distroless</text>

  <line x1="189" y1="120" x2="209" y2="120" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Scan (Trivy + Grype) -->
  <rect x="209" y="84" width="82" height="72" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <image href="/icons/trivy.svg" x="221" y="92" width="24" height="24"/>
  <image href="/icons/grype.svg" x="249" y="92" width="24" height="24"/>
  <text x="250" y="134" text-anchor="middle" font-size="9" fill="#94a3b8">Scan</text>
  <text x="250" y="145" text-anchor="middle" font-size="8" fill="#64748b">Trivy + Grype</text>

  <line x1="291" y1="120" x2="311" y2="120" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SBOM -->
  <rect x="311" y="84" width="72" height="72" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <image href="/icons/syft.svg" x="337" y="96" width="28" height="28"/>
  <text x="347" y="139" text-anchor="middle" font-size="9" fill="#94a3b8">SBOM</text>
  <text x="347" y="150" text-anchor="middle" font-size="8" fill="#64748b">Syft</text>

  <line x1="383" y1="120" x2="403" y2="120" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Sign -->
  <rect x="403" y="84" width="82" height="72" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <image href="/icons/cosign.svg" x="415" y="92" width="26" height="26"/>
  <image href="/icons/sigstore.svg" x="445" y="92" width="26" height="26"/>
  <text x="444" y="134" text-anchor="middle" font-size="9" fill="#94a3b8">Sign</text>
  <text x="444" y="145" text-anchor="middle" font-size="8" fill="#64748b">Cosign keyless</text>

  <line x1="485" y1="120" x2="505" y2="120" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SLSA -->
  <rect x="505" y="84" width="72" height="72" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <image href="/icons/slsa.svg" x="531" y="96" width="28" height="28"/>
  <text x="541" y="139" text-anchor="middle" font-size="9" fill="#94a3b8">SLSA L2</text>
  <text x="541" y="150" text-anchor="middle" font-size="8" fill="#64748b">provenance</text>

  <line x1="577" y1="120" x2="597" y2="120" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GitOps update -->
  <rect x="597" y="84" width="82" height="72" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <image href="/icons/kustomize.svg" x="623" y="96" width="28" height="28"/>
  <text x="638" y="139" text-anchor="middle" font-size="9" fill="#94a3b8">Pin digest</text>
  <text x="638" y="150" text-anchor="middle" font-size="8" fill="#64748b">gitops repo</text>

  <!-- ══ ROW 2: GHCR + ArgoCD ══ -->

  <!-- GHCR -->
  <rect x="15" y="200" width="350" height="110" rx="8" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="30" y="216" font-size="9" font-weight="bold" fill="#eab308">GHCR — GitHub Container Registry</text>

  <rect x="25" y="224" width="72" height="72" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
  <image href="/icons/ghcr.svg" x="51" y="236" width="28" height="28"/>
  <text x="61" y="279" text-anchor="middle" font-size="9" fill="#94a3b8">GHCR</text>
  <text x="61" y="290" text-anchor="middle" font-size="8" fill="#64748b">@sha256</text>

  <!-- Attestation badges -->
  <rect x="108" y="228" width="85" height="18" rx="3" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="150" y="241" text-anchor="middle" font-size="8" fill="#a78bfa">Cosign Signature</text>
  <rect x="108" y="250" width="85" height="18" rx="3" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="150" y="263" text-anchor="middle" font-size="8" fill="#a78bfa">SBOM Attestation</text>
  <rect x="108" y="272" width="85" height="18" rx="3" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="150" y="285" text-anchor="middle" font-size="8" fill="#6ee7b7">SLSA Provenance</text>
  <rect x="108" y="294" width="85" height="16" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="150" y="305" text-anchor="middle" font-size="8" fill="#94a3b8">No :latest tags</text>

  <!-- ArgoCD -->
  <rect x="390" y="200" width="160" height="110" rx="8" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="405" y="216" font-size="9" font-weight="bold" fill="#10b981">GitOps</text>

  <rect x="405" y="224" width="72" height="72" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <image href="/icons/argo.svg" x="431" y="236" width="28" height="28"/>
  <text x="441" y="279" text-anchor="middle" font-size="9" fill="#94a3b8">ArgoCD</text>
  <text x="441" y="290" text-anchor="middle" font-size="8" fill="#64748b">auto-sync</text>

  <!-- ══ ROW 3: Admission + Runtime ══ -->

  <!-- Admission -->
  <rect x="560" y="200" width="160" height="110" rx="8" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="575" y="216" font-size="9" font-weight="bold" fill="#ef4444">Admission</text>

  <rect x="575" y="224" width="72" height="72" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <image href="/icons/kyverno.svg" x="601" y="236" width="28" height="28"/>
  <text x="611" y="279" text-anchor="middle" font-size="9" fill="#94a3b8">Kyverno</text>
  <text x="611" y="290" text-anchor="middle" font-size="8" fill="#64748b">verifyImages</text>

  <!-- Runtime -->
  <rect x="730" y="200" width="155" height="110" rx="8" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="745" y="216" font-size="9" font-weight="bold" fill="#f97316">Runtime</text>

  <rect x="745" y="224" width="66" height="60" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <image href="/icons/kubernetes.svg" x="764" y="233" width="28" height="28"/>
  <text x="778" y="272" text-anchor="middle" font-size="9" fill="#94a3b8">Pod</text>

  <rect x="745" y="290" width="66" height="15" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <image href="/icons/falco.svg" x="748" y="292" width="11" height="11"/>
  <text x="795" y="301" text-anchor="middle" font-size="8" fill="#f87171">Falco</text>

  <!-- ══ BOTTOM: Trust model ══ -->
  <rect x="15" y="330" width="870" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="348" text-anchor="middle" font-size="10" font-weight="bold" fill="#f1f5f9">3 Enforcement Layers — defeating requires compromising all three simultaneously</text>
  <rect x="30" y="356" width="180" height="14" rx="3" fill="#312e81" stroke="#6366f1" stroke-width="0.8"/>
  <text x="120" y="366" text-anchor="middle" font-size="8" fill="#a5b4fc">Layer 1: Registry — Cosign sig + Rekor</text>
  <rect x="360" y="356" width="180" height="14" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="450" y="366" text-anchor="middle" font-size="8" fill="#fca5a5">Layer 2: Admission — Kyverno verifyImages</text>
  <rect x="690" y="356" width="180" height="14" rx="3" fill="#431407" stroke="#f97316" stroke-width="0.8"/>
  <text x="780" y="366" text-anchor="middle" font-size="8" fill="#fdba74">Layer 3: Runtime — Falco syscall rules</text>

  <!-- ══ ARROWS ══ -->
  <!-- Sign → GHCR -->
  <line x1="444" y1="156" x2="444" y2="185" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="444" y1="185" x2="61" y2="200" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <!-- SLSA → gitops -->
  <line x1="638" y1="156" x2="638" y2="185" stroke="#10b981" stroke-width="1.5"/>
  <line x1="638" y1="185" x2="441" y2="200" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <!-- GHCR → Kyverno -->
  <line x1="205" y1="255" x2="390" y2="255" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-y)"/>
  <line x1="390" y1="255" x2="560" y2="255" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-y)"/>
  <!-- ArgoCD → Kyverno -->
  <line x1="550" y1="260" x2="575" y2="260" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <!-- Kyverno → Pod -->
  <line x1="720" y1="260" x2="745" y2="260" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/>

</svg>
