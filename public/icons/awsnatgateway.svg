<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <rect width="80" height="80" rx="12" fill="#E07B39"/>
  <!-- NAT routing symbol: two arrows crossing through a box -->
  <!-- Box -->
  <rect x="24" y="28" width="32" height="24" rx="4" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Left arrow in -->
  <line x1="14" y1="34" x2="24" y2="34" stroke="white" stroke-width="2.5"/>
  <polyline points="20,30 24,34 20,38" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right arrow out -->
  <line x1="56" y1="46" x2="66" y2="46" stroke="white" stroke-width="2.5"/>
  <polyline points="62,42 66,46 62,50" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- NAT text -->
  <text x="40" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">NAT</text>
</svg>
